<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodefall Arena</title>
    <script type="module" crossorigin src="/nodefall/assets/index-Ch4NHthP.js"></script>
    <link rel="stylesheet" crossorigin href="/nodefall/assets/index-qcxJ2jlq.css">
  </head>
  <body>
    <main id="game"></main>

    <!-- Auth UI containers -->
    <div id="auth-root">
      <div id="sign-in-menu" class="menu hidden"></div>
      <div id="sign-in-signup-menu" class="menu hidden"></div>
      <div id="sign-in-email-menu" class="menu hidden"></div>
      <div id="sign-up-email-menu" class="menu hidden"></div>
      <div id="play-menu" class="menu hidden"></div>
    </div>

    <!-- Main DOM UI (titles, welcome) rendered above canvas for crisp text -->
    <div id="ui-root">
      <div id="title">NODEFALL</div>
      <div id="welcome"><h2 id="welcome-h2">Welcome</h2><div id="welcome-elo" class="hidden"></div></div>
    </div>

    <!-- VS / Countdown DOM UI -->
    <div id="vs-root" class="hidden">
      <div id="vs-left" class="vs-side">
        <div id="vs-left-name" class="vs-name"></div>
        <div id="vs-left-elo" class="vs-elo"></div>
      </div>
      <div id="vs-vs" class="vs-vs">Vs</div>
      <div id="vs-right" class="vs-side">
        <div id="vs-right-name" class="vs-name"></div>
        <div id="vs-right-elo" class="vs-elo"></div>
      </div>
    </div>
    <div id="countdown-overlay" class="countdown hidden"></div>

    <!-- Waiting / Server spin DOM UI -->
    <div id="waiting-root" class="hidden">
      <div id="waiting-inner">
        <div id="waiting-spinner" aria-hidden="true"></div>
        <div id="spinning-up" class="waiting-line">Spinning up server</div>
        <div id="waiting-for-opponent" class="waiting-line">Waiting for opponent</div>
      </div>
    </div>

    <!-- Match end (You Won / You Lost) DOM UI -->
    <div id="end-screen" class="hidden">
      <div id="end-message"></div>
      <div id="end-elo-value"></div>
    </div>

    <div id="leftPanel"></div>
    <div id="rightPanel"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
